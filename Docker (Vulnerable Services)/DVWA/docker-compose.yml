services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "9000:80"
    environment:
      MYSQL_USER: dvwa
      MYSQL_PASS: dvwa
      - dvwa_net
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: dvwa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa
    networks:
      - dvwa_net
    volumes:
      - dvwa_db:/var/lib/mysql

networks:
  dvwa_net:

volumes:
  dvwa_db: